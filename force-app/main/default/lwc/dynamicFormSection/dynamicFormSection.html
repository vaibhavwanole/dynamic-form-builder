<template>
    <div class="slds-box slds-box_x-small slds-m-bottom_medium dynamic-form-section">
        <h3 class="slds-text-heading_small slds-m-bottom_x-small">{section.sectionName}</h3>
        <p if:true={section.sectionDescription} class="slds-text-body_small slds-m-bottom_small slds-text-color_weak">
            {section.sectionDescription}
        </p>
        <div class="slds-grid slds-wrap">
            <template for:each={fieldsWithState} for:item="item">
                <div key={item.key} class={columnClass}>
                    <c-dynamic-form-field
                        field={item.field}
                        value={item.value}
                        hidden={item.hidden}
                        forced-required={item.forcedRequired}
                        onfieldchange={handleFieldChange}>
                    </c-dynamic-form-field>
                </div>
            </template>
        </div>
    </div>
</template>
